name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Generate Android project scaffold
        run: |
          rm -rf android
          flutter create --platforms=android --org com.telugureader --project-name telugu_reader .

      - name: Apply custom native files
        run: |
          mkdir -p android/app/src/main/kotlin/com/telugureader/telugu_reader
          cp native_overrides/MainActivity.kt android/app/src/main/kotlin/com/telugureader/telugu_reader/MainActivity.kt
          cp native_overrides/TeluguReaderAccessibilityService.kt android/app/src/main/kotlin/com/telugureader/telugu_reader/TeluguReaderAccessibilityService.kt
          mkdir -p android/app/src/main/res/xml
          cp native_overrides/accessibility_service_config.xml android/app/src/main/res/xml/accessibility_service_config.xml
          python3 native_overrides/patch_manifest.py

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: telugu-reader-apk
          path: build/app/outputs/flutter-apk/app-release.apk
